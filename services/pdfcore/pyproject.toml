[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "pdfcore"
version = "0.1.0"
description = "Server and sidecar PDF operations for the PDF suite."
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = ["pikepdf~=10.17"]

[dependency-groups]
dev = ["pytest==9.1.1", "reportlab==5.0.1", "ruff==0.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/pdfcore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
