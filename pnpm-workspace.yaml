packages:
  - apps/*
  - packages/*
  - e2e

savePrefix: ''

catalog:
  '@cantoo/pdf-lib': 2.11.1
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 9.39.5
  fflate: 0.8.3
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3
  use-intl: 4.14.9
  vitest: 5.0.4
  zod: 4.6.7

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  unrs-resolver: true

# Exceptions to pnpm's 1-day minimumReleaseAge, all for the October 2026 Next.js/React
# security release (next 16.4.1, react 19.3.1). Remove once they are older than a day.
minimumReleaseAgeExclude:
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  - eslint-config-next@16.4.1
  - next@16.4.1
  - react-dom@19.3.1
  - react@19.3.1
